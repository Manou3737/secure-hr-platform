
name: Secure HR Platform CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django-tests:
    name: Django checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DJANGO_SECRET_KEY: "temporary-ci-test-key-not-for-production"
      DJANGO_DEBUG: "False"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock

      - name: Generate temporary bank encryption key
        run: |
          python -c "from cryptography.fernet import Fernet; print('BANK_ENCRYPTION_KEY=' + Fernet.generate_key().decode())" >> "$GITHUB_ENV"

      - name: Check Django configuration
        run: |
          python backend/manage.py check

      - name: Run Django test suite
        run: |
          python backend/manage.py test accounts employees --noinput
