      description: |-
        * `CHECKING` - Checking
        * `SAVINGS` - Savings
    ActionEnum:
      enum:
      - VIEW
      - DOWNLOAD
      - CREATE
      - UPDATE
      - VERIFY
      - REJECT
      - ARCHIVE
      - CREATE_VERSION
      - ACCESS_DENIED
      type: string
      description: |-
        * `VIEW` - View
        * `DOWNLOAD` - Download
        * `CREATE` - Create
        * `UPDATE` - Update
        * `VERIFY` - Verify
