      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/employees/leave-requests/{id}/approve/:
    post:
      operationId: v1_employees_leave_requests_approve_create
      description: Approve a pending leave request.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this leave request.
        required: true
