        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequest'
          description: ''
  /api/v1/employees/leave-requests/{id}/reject/:
    post:
      operationId: v1_employees_leave_requests_reject_create
      description: Reject a pending leave request.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this leave request.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveRequest'
