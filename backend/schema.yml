components:
  schemas:
    AccountTypeEnum:
      enum:
      - CHECKING
      - SAVINGS
      type: string
      description: |-
        * `CHECKING` - Checking
        * `SAVINGS` - Savings
    AuthToken:
      type: object
      description: Validate user credentials for JWT authentication.
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    BankAccount:
      type: object
      description: Serialize employee bank account data securely.
      properties:
        id:
          type: integer
          readOnly: true
        employee:
          type: integer
        account_type:
          $ref: '#/components/schemas/AccountTypeEnum'
        routing_number:
          type: string
          writeOnly: true
        account_number:
          type: string
          writeOnly: true
        masked_routing_number:
          type: string
          description: Return only the last four digits of the routing number.
          readOnly: true
        masked_account_number:
          type: string
          description: Return only the last four digits of the account number.
          readOnly: true
        last_four:
          type: string
          readOnly: true
        is_primary:
          type: boolean
        is_verified:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - account_number
      - account_type
      - created_at
      - employee
      - id
      - is_verified
      - last_four
      - masked_account_number
      - masked_routing_number
      - routing_number
      - updated_at
    EmployeeProfile:
      type: object
      description: Serialize employee HR profile data.
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
        employee_id:
          type: string
          maxLength: 50
        department:
          type: integer
        position:
          type: integer
        phone:
          type: string
          maxLength: 30
        hire_date:
          type: string
          format: date
        date_of_birth:
          type: string
          format: date
          nullable: true
        address:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - department
      - employee_id
      - hire_date
      - id
      - position
      - updated_at
      - user
    LeaveRequest:
      type: object
      description: Serialize employee leave requests.
      properties:
        id:
          type: integer
          readOnly: true
        employee:
          type: integer
        leave_type:
          $ref: '#/components/schemas/LeaveTypeEnum'
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        reason:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/LeaveRequestStatusEnum'
          readOnly: true
        reviewed_by:
          type: integer
          readOnly: true
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - employee
      - end_date
      - id
      - leave_type
      - reviewed_at
      - reviewed_by
      - start_date
      - status
      - updated_at
    LeaveRequestStatusEnum:
      enum:
      - PENDING
      - APPROVED
      - REJECTED
      - CANCELLED
      type: string
      description: |-
        * `PENDING` - Pending
        * `APPROVED` - Approved
        * `REJECTED` - Rejected
        * `CANCELLED` - Cancelled
    LeaveTypeEnum:
      enum:
      - VACATION
      - SICK
      - PERSONAL
      - OTHER
      type: string
      description: |-
        * `VACATION` - Vacation
        * `SICK` - Sick
        * `PERSONAL` - Personal
        * `OTHER` - Other
    LoginResponse:
      type: object
      properties:
        refresh:
          type: string
        access:
          type: string
      required:
      - access
      - refresh
    LogoutRequest:
      type: object
      properties:
        refresh:
          type: string
          description: Refresh token to invalidate.
      required:
      - refresh
    PaginatedBankAccountList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/BankAccount'
    PaginatedEmployeeProfileList:
      type: object
      required:
      - count
