components:
  schemas:
    AccountTypeEnum:
      enum:
      - CHECKING
      - SAVINGS
      type: string
      description: |-
        * `CHECKING` - Checking
        * `SAVINGS` - Savings
    ActionEnum:
      enum:
      - VIEW
      - DOWNLOAD
      - CREATE
      - UPDATE
      - VERIFY
      - REJECT
      - ARCHIVE
      - CREATE_VERSION
      - ACCESS_DENIED
      type: string
      description: |-
        * `VIEW` - View
        * `DOWNLOAD` - Download
        * `CREATE` - Create
        * `UPDATE` - Update
        * `VERIFY` - Verify
        * `REJECT` - Reject
        * `ARCHIVE` - Archive
        * `CREATE_VERSION` - Create version
        * `ACCESS_DENIED` - Access denied
    ApplicationStatusChange:
      type: object
      description: Validate application status change requests.
      properties:
        status:
          $ref: '#/components/schemas/JobApplicationStatusEnum'
        note:
          type: string
          maxLength: 2000
      required:
      - status
    ApplicationSubmissionResponse:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    AuditActionDistribution:
      type: object
      properties:
        action:
          type: string
        count:
          type: integer
      required:
      - action
      - count
    AuditDailyActivity:
      type: object
      properties:
        created_at__date:
          type: string
          format: date
        count:
          type: integer
      required:
      - count
      - created_at__date
    AuditDailyActivityGroup:
      type: object
      properties:
        general_audit:
          type: array
          items:
            $ref: '#/components/schemas/AuditDailyActivity'
        document_access:
          type: array
          items:
            $ref: '#/components/schemas/AuditDailyActivity'
        workflow:
          type: array
          items:
            $ref: '#/components/schemas/AuditDailyActivity'
      required:
      - document_access
      - general_audit
      - workflow
    AuditDocumentAccess:
      type: object
      properties:
        distribution:
          type: array
          items:
            $ref: '#/components/schemas/AuditActionDistribution'
        access_denied:
          type: integer
      required:
      - access_denied
      - distribution
    AuditEventDistribution:
      type: object
      properties:
        event_type:
          type: string
        count:
          type: integer
      required:
      - count
      - event_type
    AuditGeneralAudit:
      type: object
      properties:
        distribution:
          type: array
          items:
            $ref: '#/components/schemas/AuditActionDistribution'
      required:
      - distribution
    AuditMetrics:
      type: object
      properties:
        as_of:
          type: string
          format: date
        period_days:
          type: integer
        overview:
          $ref: '#/components/schemas/AuditOverview'
        general_audit:
          $ref: '#/components/schemas/AuditGeneralAudit'
        document_access:
          $ref: '#/components/schemas/AuditDocumentAccess'
        workflows:
          $ref: '#/components/schemas/AuditWorkflows'
        daily_activity:
          $ref: '#/components/schemas/AuditDailyActivityGroup'
        recent_events:
          $ref: '#/components/schemas/AuditRecentEvents'
      required:
      - as_of
      - daily_activity
      - document_access
      - general_audit
      - overview
      - period_days
      - recent_events
      - workflows
    AuditOverview:
      type: object
      properties:
        total_entries:
          type: integer
        general_audit_entries:
          type: integer
        document_access_entries:
          type: integer
        workflow_entries:
          type: integer
      required:
      - document_access_entries
      - general_audit_entries
      - total_entries
      - workflow_entries
    AuditRecentDocumentEvent:
      type: object
      properties:
        id:
          type: integer
        action:
          type: string
        user_id:
          type: integer
          nullable: true
        document_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - action
      - created_at
      - document_id
      - id
      - user_id
    AuditRecentEvents:
      type: object
      properties:
        general_audit:
          type: array
          items:
            $ref: '#/components/schemas/AuditRecentGeneralEvent'
        document_access:
          type: array
          items:
            $ref: '#/components/schemas/AuditRecentDocumentEvent'
        workflow:
          type: array
          items:
            $ref: '#/components/schemas/AuditRecentWorkflowEvent'
      required:
      - document_access
      - general_audit
      - workflow
    AuditRecentGeneralEvent:
      type: object
      properties:
        id:
          type: integer
        action:
          type: string
        user_id:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - action
      - created_at
      - id
      - user_id
    AuditRecentWorkflowEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        event_type:
          type: string
        outcome:
          type: string
        actor_id:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - actor_id
      - created_at
      - event_type
      - id
      - outcome
