      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccount'
          description: ''
    delete:
      operationId: v1_employees_bank_accounts_destroy
      description: Prevent physical deletion of bank accounts.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this bank account.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/employees/leave-requests/:
    get:
      operationId: v1_employees_leave_requests_list
      description: API endpoint for managing employee leave requests.
      parameters:
      - in: query
        name: employee
        schema:
          type: integer
      - in: query
        name: end_date
        schema:
          type: string
          format: date
      - in: query
        name: leave_type
        schema:
          type: string
          enum:
          - OTHER
          - PERSONAL
          - SICK
          - VACATION
        description: |-
          * `VACATION` - Vacation
          * `SICK` - Sick
          * `PERSONAL` - Personal
          * `OTHER` - Other
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: start_date
        schema:
          type: string
          format: date
      - in: query
        name: status
        schema:
          type: string
          enum:
          - APPROVED
          - CANCELLED
          - PENDING
          - REJECTED
        description: |-
          * `PENDING` - Pending
          * `APPROVED` - Approved
          * `REJECTED` - Rejected
          * `CANCELLED` - Cancelled
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLeaveRequestList'
          description: ''
    post:
      operationId: v1_employees_leave_requests_create
      description: API endpoint for managing employee leave requests.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LeaveRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LeaveRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequest'
          description: ''
  /api/v1/employees/leave-requests/{id}/:
