          description: ''
    patch:
      operationId: v1_employees_partial_update
      description: API endpoint for managing employee profiles.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this employee profile.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEmployeeProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEmployeeProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEmployeeProfile'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeProfile'
          description: ''
    delete:
      operationId: v1_employees_destroy
      description: API endpoint for managing employee profiles.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this employee profile.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/employees/bank-accounts/:
    get:
      operationId: v1_employees_bank_accounts_list
      description: Manage employee bank account information securely.
      parameters:
      - in: query
        name: account_type
        schema:
          type: string
          enum:
          - CHECKING
          - SAVINGS
        description: |-
          * `CHECKING` - Checking
          * `SAVINGS` - Savings
      - in: query
        name: employee
        schema:
          type: integer
      - in: query
        name: is_primary
        schema:
          type: boolean
      - in: query
        name: is_verified
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBankAccountList'
          description: ''
    post:
      operationId: v1_employees_bank_accounts_create
      description: Create a bank account with secure access control.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankAccount'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BankAccount'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BankAccount'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccount'
          description: ''
  /api/v1/employees/bank-accounts/{id}/:
    get:
      operationId: v1_employees_bank_accounts_retrieve
      description: Manage employee bank account information securely.
      parameters:
      - in: path
        name: id
