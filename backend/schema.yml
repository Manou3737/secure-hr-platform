        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequest'
          description: ''
  /api/v1/employees/leave-requests/{id}/cancel/:
    post:
      operationId: v1_employees_leave_requests_cancel_create
