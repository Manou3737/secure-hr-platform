openapi: 3.0.3
info:
  title: Secure HR Platform API
  version: 1.0.0
  description: Secure Human Resources Platform API for employee management, HR operations,
    and security-conscious access to sensitive data.
paths:
  /api/v1/auth/account-status/{id}/:
    patch:
      operationId: v1_auth_account_status_partial_update
      description: Updates the active status of a user account after checking object-level
        permissions. Records an audit entry and a security event.
      summary: Activate or deactivate a user account
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: ID of the user account.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAccountStatus'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAccountStatus'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAccountStatus'
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Account status updated successfully.
        '400':
          description: The submitted account status is invalid.
        '401':
          description: Authentication is required.
        '403':
          description: You do not have permission to change this account.
        '404':
          description: User account not found.
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: Authenticates a user and returns access and refresh JWT tokens.
      summary: Authenticate a user
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthToken'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthToken'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AuthToken'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '400':
          description: Invalid login credentials or request.
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      description: Invalidates a refresh token by adding it to the token blacklist.
      summary: Log out a user
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '205':
          description: Successfully logged out.
        '400':
          description: Refresh token is missing, invalid, or expired.
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      description: Returns the account information of the currently authenticated
        user.
      summary: Retrieve the current user's account
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccount'
          description: ''
        '401':
          description: Authentication is required.
  /api/v1/auth/password-change/:
    post:
      operationId: v1_auth_password_change_create
      description: Changes the authenticated user's password after validating the
        supplied credentials. Records a security event and an audit entry.
      summary: Change the current user's password
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChange'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Password changed successfully.
        '400':
          description: The submitted password data is invalid.
        '401':
          description: Authentication is required.
  /api/v1/auth/password-reset/:
    post:
      operationId: v1_auth_password_reset_create
      description: Sends a password reset link when an account exists for the submitted
        email. The response does not reveal whether the account exists.
      summary: Request a password reset
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: A generic response confirming that the request was processed.
        '400':
          description: The submitted email data is invalid.
  /api/v1/auth/password-reset-confirm/:
    post:
      operationId: v1_auth_password_reset_confirm_create
      description: Resets a user's password after validating the password reset credentials.
      summary: Confirm a password reset
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Password reset successfully.
        '400':
          description: The reset credentials or password data are invalid or expired.
  /api/v1/auth/privileges/{id}/:
    patch:
      operationId: v1_auth_privileges_partial_update
      description: Updates the administrative privileges of a user. Restricted to
        administrators.
      summary: Update user privileges
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: ID of the user account.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserPrivilege'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserPrivilege'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserPrivilege'
      security:
      - jwtAuth: []
      responses:
        '200':
          description: User privileges updated successfully.
        '400':
          description: The submitted privilege data is invalid.
        '401':
          description: Authentication is required.
        '403':
          description: Administrator permissions are required.
        '404':
          description: User account not found.
  /api/v1/auth/refresh/:
    post:
      operationId: v1_auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      description: Handles user registration.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistration'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegistration'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegistration'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegistration'
          description: ''
  /api/v1/auth/verify-email/:
    get:
      operationId: v1_auth_verify_email_list
      description: Verifies a user's email address using the UID and token provided
        in the verification link.
      summary: Verify an email address
      parameters:
      - in: query
        name: token
        schema:
          type: string
        description: Email verification token.
        required: true
      - in: query
        name: uid
        schema:
          type: string
        description: Base64-encoded user identifier.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Email address verified successfully.
        '400':
          description: Missing, invalid, or expired verification credentials.
  /api/v1/employees/:
    get:
      operationId: v1_employees_list
      description: API endpoint for managing employee profiles.
      parameters:
      - in: query
        name: department
        schema:
          type: integer
      - in: query
        name: hire_date
        schema:
          type: string
          format: date
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: position
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEmployeeProfileList'
          description: ''
    post:
      operationId: v1_employees_create
      description: API endpoint for managing employee profiles.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmployeeProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmployeeProfile'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeProfile'
          description: ''
  /api/v1/employees/{id}/:
    get:
      operationId: v1_employees_retrieve
      description: API endpoint for managing employee profiles.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this employee profile.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeProfile'
          description: ''
    put:
      operationId: v1_employees_update
      description: API endpoint for managing employee profiles.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this employee profile.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmployeeProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmployeeProfile'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
